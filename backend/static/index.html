<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quill Cowork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F4; --sidebar:#F3F0EA; --border:#E6E1D7; --border-2:#ECE8E0;
  --border-3:#E0DACE; --border-4:#E3DED4;
  --ink:#23211D; --ink-2:#5E5A52; --ink-3:#6A655C; --ink-4:#7A756B;
  --ink-5:#8F8A80; --ink-6:#9C978D;
  --link:#2E4A78; --warn:#C98A2B; --ok:#4F7A5A; --err:#B4574A;
  --card:#FFFFFF; --card-2:#FCFBF8; --card-3:#F6F3ED; --chip:#F2EFE8; --hover:#E9E5DD;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--link)}a:hover{color:#1C3257}
textarea,input{font-family:inherit}
textarea::placeholder,input::placeholder{color:var(--ink-6)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#DED9CE;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#CFC8BB;background-clip:content-box}

@keyframes qc-pulse{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes qc-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#app{height:100vh;display:flex;background:var(--paper)}

/* ---------- Sidebar ---------- */
#sidebar{width:268px;flex:none;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border);min-height:0;transition:width .2s ease}
#sidebar.collapsed{width:0;border-right:none;overflow:hidden}
.sb-brand{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px}
.sb-brand-l{display:flex;align-items:center;gap:10px}
.sb-logo{width:22px;height:22px;border-radius:6px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.sb-logo svg{width:12px;height:12px}
.sb-title{font-family:Newsreader,serif;font-size:18px;letter-spacing:-0.01em;color:var(--ink)}
.icon-btn{width:30px;height:30px;border:none;background:transparent;border-radius:7px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.sb-new{padding:4px 12px 10px;display:flex;flex-direction:column;gap:8px}
.btn-new{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border-3);background:#FFFFFF;border-radius:9px;font:500 13.5px Geist,sans-serif;color:var(--ink);transition:background .15s}
.btn-new:hover{background:var(--card-2)}
.sb-search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;background:#EBE7DF}
.sb-search svg{flex:none}
.sb-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 13px Geist,sans-serif;color:var(--ink)}
.sb-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 8px 12px;display:flex;flex-direction:column;gap:18px}
.sb-section{display:flex;flex-direction:column;gap:1px}
.sb-section-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
.sb-section-title{font:500 11px Geist,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-5)}
.sb-section-count{font:500 11px 'Geist Mono',monospace;color:var(--ink-5)}

.chat-row{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border:none;border-radius:7px;background:transparent;font:400 13.5px Geist,sans-serif;color:var(--ink);width:100%;transition:background .12s;cursor:pointer;text-align:left}
.chat-row:hover{background:var(--hover)}
.chat-row.active{background:#E6E1D8}
.chat-row-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row-running{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.chat-delete{width:20px;height:20px;flex:none;border:none;background:transparent;border-radius:4px;color:var(--ink-4);display:none;align-items:center;justify-content:center;padding:0;transition:background .12s,color .12s}
.chat-row:hover .chat-delete,
.chat-row.active .chat-delete{display:flex}
.chat-delete:hover{background:#FFFFFF;color:var(--err)}
.chat-delete svg{width:11px;height:11px}

.conn-row{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:7px;transition:background .12s}
.conn-row:hover{background:var(--hover)}
.conn-badge{width:22px;height:22px;flex:none;border-radius:6px;border:1px solid var(--border-3);background:#FFFFFF;display:flex;align-items:center;justify-content:center;font:600 10.5px Geist,sans-serif;color:var(--ink-2)}
.conn-name{flex:1;min-width:0;font:400 13px Geist,sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn-toggle{width:28px;height:16px;flex:none;border:none;border-radius:99px;padding:2px;display:flex;transition:background .15s,justify-content .15s}
.conn-toggle .knob{width:12px;height:12px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.conn-toggle.on{background:var(--ink);justify-content:flex-end}
.conn-toggle.off{background:#D6D1C7;justify-content:flex-start}

.sb-footer{flex:none;border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px;background:transparent;border-left:none;border-right:none;border-bottom:none;width:100%;text-align:left;transition:background .12s;cursor:pointer}
.sb-footer:hover{background:var(--hover)}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:var(--link);color:var(--paper);display:flex;align-items:center;justify-content:center;font:600 12px Geist,sans-serif;flex:none}
.sb-user{flex:1;min-width:0;display:flex;flex-direction:column}
.sb-user-name{font:500 13px/1.2 Geist,sans-serif;color:var(--ink)}
.sb-user-sub{font:400 11.5px/1.3 Geist,sans-serif;color:var(--ink-5)}

/* ---------- Main ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.main-header{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border-2)}
.main-title{flex:1;min-width:0;font:500 14px Geist,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.main-model{font:400 12px Geist,sans-serif;color:var(--ink-5)}

#stream{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
#stream.empty{justify-content:center;padding-bottom:120px}
#stream.empty .stream-inner{margin-top:0}
.stream-inner{margin-top:auto;width:100%;max-width:720px;margin-left:auto;margin-right:auto;padding:32px 24px 8px;display:flex;flex-direction:column;gap:22px}
.empty-title{font:400 34px/1.2 Newsreader,serif;letter-spacing:-0.02em;color:var(--ink);text-align:center;margin:0 0 6px}

.msg-user{display:flex;flex-direction:column;align-items:flex-end;gap:6px;animation:qc-in .25s ease-out}
.msg-user-files{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.msg-user-file{font:500 12px 'Geist Mono',monospace;padding:4px 8px;border:1px solid var(--border-4);border-radius:6px;background:#FFFFFF;color:var(--ink-2)}
.msg-user-bubble{max-width:80%;background:#EFEBE3;border-radius:16px;padding:10px 14px;font:400 15px/1.55 Geist,sans-serif;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.msg-user-bubble.saved{background:#E6F1EA;color:#2C6B47;font-style:italic}

.msg-asst{display:flex;flex-direction:column;gap:10px;animation:qc-in .25s ease-out}
.msg-asst-blocks{display:flex;flex-direction:column;gap:10px}
.blk-p{margin:0;font:400 17px/1.65 Newsreader,serif;color:var(--ink);white-space:pre-wrap}
.blk-li{display:flex;gap:10px;font:400 17px/1.65 Newsreader,serif;color:var(--ink)}
.blk-li-marker{color:var(--ink-6);min-width:14px}
.blk-li-text{flex:1;white-space:pre-wrap}
.blk-h{font:600 15px/1.4 Geist,sans-serif;color:var(--ink);margin-top:4px}
.blk-code{margin:0;padding:12px 14px;background:var(--chip);border:1px solid var(--border);border-radius:10px;font:400 13px/1.6 'Geist Mono',monospace;color:var(--ink);overflow-x:auto;white-space:pre}
.msg-asst-actions{display:flex;gap:4px;margin-left:-6px}
.msg-action{height:28px;padding:0 8px;border:none;background:transparent;border-radius:6px;font:500 12px Geist,sans-serif;color:var(--ink-4);display:flex;align-items:center;gap:5px;transition:background .12s,color .12s}
.msg-action:hover{background:#EFEBE3;color:var(--ink)}
.msg-action svg{width:13px;height:13px}

.perm-card{border:1px solid var(--border-3);background:#FFFFFF;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(35,33,29,.04),0 6px 20px rgba(35,33,29,.05);animation:qc-in .25s ease-out}
.perm-head{padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px}
.perm-title{display:flex;align-items:center;gap:8px;font:600 13px Geist,sans-serif;color:var(--ink)}
.perm-dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.perm-target{font:400 13px/1.55 'Geist Mono',monospace;background:var(--card-3);border:1px solid #ECE7DD;border-radius:8px;padding:9px 12px;word-break:break-all;color:var(--ink)}
.perm-reason{font:400 14px/1.5 Geist,sans-serif;color:var(--ink-3)}
.perm-actions{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid #EFEBE3;background:var(--card-2);flex-wrap:wrap}
.perm-btn{height:34px;padding:0 14px;border:1px solid var(--border-4);background:#FFFFFF;border-radius:8px;font:500 13px Geist,sans-serif;color:var(--ink);transition:background .15s}
.perm-btn:hover{background:#F3F0EA}
.perm-btn.primary{padding:0 16px;border-color:var(--ink);background:var(--ink);color:var(--paper)}
.perm-btn.primary:hover{background:#3A3731}

.step{display:flex;align-items:center;gap:8px;font:400 13px Geist,sans-serif;color:var(--ink-4)}
.step-dot{width:16px;height:16px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.step-dot.ok{background:var(--ok)}
.step-dot.err{background:var(--err)}
.step-dot svg{width:9px;height:9px}
.step-label{flex:none;color:var(--ink-4)}
.step-target{font:400 12px 'Geist Mono',monospace;color:var(--ink-2);background:var(--chip);padding:2px 6px;border-radius:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.thinking{display:flex;gap:5px;padding:6px 0}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--ink-4);animation:qc-pulse 1.2s infinite ease-in-out}
.thinking span:nth-child(2){animation-delay:.15s}
.thinking span:nth-child(3){animation-delay:.3s}

/* ---------- Composer ---------- */
.composer-wrap{flex:none;width:100%;max-width:720px;margin:0 auto;padding:8px 24px 20px}
.composer{position:relative;background:#FFFFFF;border:1px solid var(--border-4);border-radius:20px;box-shadow:0 1px 2px rgba(35,33,29,.04),0 8px 28px rgba(35,33,29,.06);padding:12px 12px 10px 16px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;border:none;outline:none;resize:none;background:transparent;font:400 15px/1.55 Geist,sans-serif;color:var(--ink);padding:4px 0;min-height:26px;max-height:220px}
.composer-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.composer-btn{width:32px;height:32px;border:1px solid var(--border-4);background:#FFFFFF;border-radius:8px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,color .15s}
.composer-btn:hover{background:#F3F0EA;color:var(--ink)}
.composer-btn.wide{width:auto;padding:0 10px;gap:6px;font:500 12.5px Geist,sans-serif}
.composer-btn svg{width:15px;height:15px}
.composer-status{height:32px;padding:0 10px;border-radius:8px;font:500 12.5px Geist,sans-serif;color:var(--ink-4);display:flex;align-items:center;gap:6px}
.composer-status svg{width:13px;height:13px}
.composer-spacer{flex:1}
.composer-model{height:32px;padding:0 8px 0 10px;border:none;background:transparent;border-radius:8px;font:500 12.5px Geist,sans-serif;color:var(--ink);display:flex;align-items:center;gap:4px;transition:background .15s}
.composer-model:hover{background:#F3F0EA}
.composer-model svg{width:12px;height:12px}
.composer-send{width:32px;height:32px;border:none;background:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s}
.composer-send:hover{background:#3A3731}
.composer-send[disabled]{background:#CFCAC0;cursor:not-allowed}
.composer-send svg{width:15px;height:15px}
.composer-stop{width:32px;height:32px;border:none;background:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.composer-stop:hover{background:#3A3731}
.composer-stop span{width:10px;height:10px;border-radius:2px;background:var(--paper)}
.composer-hint{text-align:center;font:400 11.5px Geist,sans-serif;color:var(--ink-6);margin-top:10px}

/* ---------- Attachments ---------- */
.attachments{display:flex;flex-wrap:wrap;gap:6px}
.attachment{display:flex;align-items:center;gap:6px;font:500 12px 'Geist Mono',monospace;padding:4px 4px 4px 8px;border:1px solid var(--border-4);border-radius:6px;background:var(--paper);color:var(--ink-2)}
.attachment button{width:18px;height:18px;border:none;background:transparent;border-radius:4px;color:var(--ink-4);display:flex;align-items:center;justify-content:center;padding:0}
.attachment button:hover{background:#EFEBE3}
.attachment button svg{width:10px;height:10px}

/* ---------- Model dropdown ---------- */
.model-dropdown{position:absolute;right:52px;bottom:52px;width:280px;background:#FFFFFF;border:1px solid var(--border-3);border-radius:12px;box-shadow:0 12px 40px rgba(35,33,29,.14);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:5;animation:qc-in .15s ease-out}
.model-dropdown.hidden{display:none}
.model-item{text-align:left;display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:none;border-radius:8px;background:transparent;transition:background .12s}
.model-item:hover{background:#F3F0EA}
.model-item.selected{background:var(--card-3)}
.model-item-body{flex:1;display:flex;flex-direction:column;gap:2px}
.model-item-name{font:500 13.5px Geist,sans-serif;color:var(--ink)}
.model-item-desc{font:400 12px/1.4 Geist,sans-serif;color:var(--ink-4);word-break:break-all}
.model-item svg{margin-top:3px;width:14px;height:14px}

/* ---------- Profile modal ---------- */
.profile-overlay{position:fixed;inset:0;background:rgba(35,33,29,.18);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100}
.profile-overlay.hidden{display:none}
.profile-modal{width:440px;max-width:92vw;max-height:82vh;background:var(--paper);border:1px solid var(--border-3);border-radius:16px;box-shadow:0 20px 60px rgba(35,33,29,.18);display:flex;flex-direction:column;overflow:hidden;animation:qc-in .2s ease-out}
.profile-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.profile-head-title{font:500 17px Newsreader,serif;letter-spacing:-0.01em;color:var(--ink)}
.profile-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.profile-section{display:flex;flex-direction:column;gap:8px}
.profile-section-title{font:500 11px Geist,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-5);margin-bottom:2px}
.profile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 13px Geist,sans-serif;color:var(--ink);padding:5px 0}
.profile-row-label{font:500 12.5px Geist,sans-serif;color:var(--ink-3)}
.profile-row input{flex:1;max-width:240px;padding:7px 10px;border:1px solid var(--border-3);background:#FFFFFF;border-radius:7px;font:400 13px Geist,sans-serif;color:var(--ink);outline:none;transition:border-color .15s}
.profile-row input:focus{border-color:var(--ink)}
.profile-badge{padding:3px 9px;border-radius:99px;font:500 11px Geist,sans-serif;letter-spacing:.02em}
.profile-badge.ok{background:#E6F1EA;color:#2C6B47}
.profile-badge.warn{background:#FBF1DC;color:#8A5A1A}
.profile-badge.err{background:#F5E0DD;color:#8A2D22}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.profile-btn{padding:7px 13px;border:1px solid var(--border-4);background:#FFFFFF;border-radius:7px;font:500 12.5px Geist,sans-serif;color:var(--ink);transition:background .15s}
.profile-btn:hover{background:#F3F0EA}
.profile-btn.primary{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.profile-btn.primary:hover{background:#3A3731}
.profile-btn.danger{color:var(--err);border-color:#E8D5D1}
.profile-btn.danger:hover{background:#F5E0DD}
.profile-key-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 11px;background:var(--card-3);border:1px solid var(--border);border-radius:6px;font:400 11.5px 'Geist Mono',monospace;color:var(--ink-2);margin-bottom:4px}
.profile-empty{font:400 12.5px Geist,sans-serif;color:var(--ink-5);padding:6px 0}

@media (max-width:720px){
  #sidebar{position:absolute;height:100vh;z-index:20;box-shadow:4px 0 20px rgba(35,33,29,.08)}
  .stream-inner{padding:24px 16px 8px}
  .composer-wrap{padding:8px 16px 16px}
  .profile-modal{width:100vw;max-width:100vw;border-radius:0;max-height:100vh;height:100vh}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-l">
        <div class="sb-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FAF8F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C12 4 6 10 5 19"></path><path d="M20 4c0 6-4 10-10 11"></path></svg>
        </div>
        <span class="sb-title">Quill Cowork</span>
      </div>
      <button class="icon-btn" id="btn-collapse" title="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg>
      </button>
    </div>
    <div class="sb-new">
      <button class="btn-new" id="btn-new">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        New task
      </button>
      <div class="sb-search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7A756B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="search" placeholder="Search tasks">
      </div>
    </div>
    <div class="sb-body">
      <div class="sb-section">
        <div class="sb-section-head"><span class="sb-section-title">Recents</span></div>
        <div id="chat-list"></div>
      </div>
      <div class="sb-section">
        <div class="sb-section-head">
          <span class="sb-section-title">Connectors</span>
          <span class="sb-section-count" id="conn-count">0</span>
        </div>
        <div id="conn-list"></div>
      </div>
      <div class="sb-section">
        <div class="sb-section-head">
          <span class="sb-section-title">Codebases</span>
          <button class="icon-btn" id="btn-add-codebase" title="Connect codebase" style="width:20px;height:20px">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
        <div id="codebase-list"></div>
      </div>
    </div>
    <button class="sb-footer" id="btn-profile">
      <span class="sb-avatar" id="sb-avatar">Y</span>
      <div class="sb-user">
        <span class="sb-user-name" id="sb-user-name">You</span>
        <span class="sb-user-sub">Personal workspace</span>
      </div>
    </button>
  </aside>

  <main>
    <header class="main-header">
      <button class="icon-btn" id="btn-open" title="Open sidebar" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg>
      </button>
      <span class="main-title" id="main-title">New task</span>
      <span class="main-model" id="main-model">Quill</span>
    </header>

    <div id="stream">
      <div class="stream-inner" id="stream-inner"></div>

<script>
(function(){
'use strict';

const VERBS = {
  run_command:'run a command', edit_file:'edit a file', read_file:'read a file',
  open_url:'open a website', create_file:'create a file', delete_file:'delete a file',
  use_connector:'use a connector', send_message:'send a message',
  write_file:'write a file', list_directory:'list a folder', search_files:'search files',
  fetch_page:'fetch a page', list_notifications:'list notifications',
  list_repos:'list repositories', create_issue:'create an issue',
  comment_on_issue:'comment on an issue', list_issues:'list issues',
  list_pull_requests:'list pull requests', list_commits:'list commits',
  mark_all_notifications_read:'mark notifications read',
  get_notification_details:'get notification details',
  search_wikipedia:'search Wikipedia', get_wikipedia_article:'read a Wikipedia article',
  list_emails:'list emails', get_email:'read an email', send_email:'send an email',
  create_draft:'create a draft', reply_to_email:'reply to an email',
  list_labels:'list Gmail labels', mark_as_read:'mark an email as read',
  archive_email:'archive an email', trash_email:'trash an email',
  web_search:'search the web'
};
const DONE = {
  run_command:'Ran', edit_file:'Edited', read_file:'Read', open_url:'Opened',
  create_file:'Created', delete_file:'Deleted', use_connector:'Searched',
  send_message:'Sent', write_file:'Wrote', list_directory:'Listed',
  search_files:'Searched', fetch_page:'Fetched', list_notifications:'Listed',
  list_repos:'Listed', create_issue:'Created', comment_on_issue:'Commented',
  list_issues:'Listed', list_pull_requests:'Listed', list_commits:'Listed',
  mark_all_notifications_read:'Marked', get_notification_details:'Read',
  search_wikipedia:'Searched', get_wikipedia_article:'Read',
  list_emails:'Listed', get_email:'Read', send_email:'Sent',
  create_draft:'Drafted', reply_to_email:'Replied',
  list_labels:'Listed', mark_as_read:'Marked', archive_email:'Archived',
  trash_email:'Trashed', web_search:'Searched'
};

const LS_NAME = 'quill.user.name';

const state = {
  chats: [{ id: uid(), title: 'New task', msgs: [] }],
  activeId: null,
  draft: '',
  attachments: [],
  phase: 'idle',
  runChat: null,
  mode: null,
  copiedId: null,
  model: 'balanced',
  models: [],
  connectors: [],
  always: [],
  sidebar: true,
  query: ''
};
state.activeId = state.chats[0].id;

let ws = null;
let wsReconnect = null;
let runId = 0;
let streamTimer = null;
let uidCounter = 1;
const pendingConfirms = {};

function uid(){ return 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
function nextMsgId(){ return uidCounter++; }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function activeChat(){ return state.chats.find(c => c.id === state.activeId); }
function currentMsgs(){ const c = activeChat(); return c ? c.msgs : []; }
function isIdle(){ return state.phase === 'idle'; }

function getMode(){
  if (state.mode) return state.mode;
  return 'ask';
}
function humanArgs(a){
  if (!a) return '';
  if (a.path) return String(a.path);
  if (a.url) return String(a.url);
  if (a.pattern) return String(a.pattern);
  if (a.query) return String(a.query);
  if (a.title) return String(a.title);
  if (a.owner && a.repo) return a.owner + '/' + a.repo;
  try { return JSON.stringify(a); } catch(e){ return String(a); }
}

/* ---------- WebSocket ---------- */
function connectWS(){
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  const host = location.host || 'localhost:8000';
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try { ws = new WebSocket(proto + '//' + host + '/ws'); }
  catch(e){ scheduleReconnect(); return; }
  ws.onopen = function(){};
  ws.onmessage = function(ev){
    let data; try { data = JSON.parse(ev.data); } catch(e){ return; }
    handleServerMessage(data);
  };
  ws.onclose = function(){ ws = null; scheduleReconnect(); };
  ws.onerror = function(){};
}
function scheduleReconnect(){
  if (wsReconnect) return;
  wsReconnect = setTimeout(function(){ wsReconnect = null; connectWS(); }, 2500);
}
function handleServerMessage(data){
  const chatId = state.runChat;
  if (chatId == null) return;
  if (data.type === 'thinking'){
    state.phase = 'thinking';
    renderStream();
  } else if (data.type === 'confirm_request'){
    state.phase = 'awaiting';
    pendingConfirms[data.call_id] = { chatId };
    pushMsg(chatId, {
      role: 'perm', tool: data.tool,
      target: humanArgs(data.arguments),
      reason: 'Quill needs your approval to continue.',
      callId: data.call_id
    });
    renderStream();
  } else if (data.type === 'reply'){
    const calls = data.tool_calls || [];
    if (calls.some(function(x){ return x.tool && (x.tool.indexOf('codebase') === 0 || x.tool === 'connect_codebase' || x.tool === 'disconnect_codebase'); })){
      setTimeout(loadCodebases, 200);
    }

    if (data.secret_saved){
      const c = state.chats.find(x => x.id === chatId);
      if (c){
        const newLabel = '[saved ' + data.secret_saved + ']';
        for (let i = c.msgs.length - 1; i >= 0; i--){
          if (c.msgs[i].role === 'user'){
            const oldText = c.msgs[i].text;
            if (c.title === oldText.slice(0, 48)) c.title = newLabel;
            c.msgs[i] = Object.assign({}, c.msgs[i], { text: newLabel, saved: true });
            break;
          }
        }
      }
    } else {
      calls.forEach(function(c){
        pushMsg(chatId, {
          role: 'step', ok: true,
          label: (DONE[c.tool] || 'Ran') + ' · ' + c.tool,
          target: humanArgs(c.arguments)
        });
      });
    }

    renderChatList();
    renderHeader();
    startStream(chatId, data.reply || '(empty response)', ++runId);
  } else if (data.type === 'error'){
    startStream(chatId, 'Error: ' + (data.message || 'unknown'), ++runId);
  }
}

/* ---------- Data loading ---------- */
async function loadConnectors(){
  try {
    const r = await fetch('/connectors');
    const d = await r.json();
    state.connectors = (d.connectors || []).map(function(c){
      const name = c.name || c.id;
      const mono = name.replace(/[^A-Za-z]/g, '').slice(0, 2) || c.id.slice(0, 2);
      return { id: c.id, name: name, mono: mono, on: true };
    });
    renderConnectors();
  } catch(e){}
}
async function loadCodebases(){
  try {
    const r = await fetch('/codebase/list');
    const d = await r.json();
    renderCodebases(d.codebases || []);
  } catch(e){}
}

function renderCodebases(list){
  const box = el('codebase-list');
  if (!box) return;
  if (list.length === 0){
    box.innerHTML = '<div style="font:400 12px Geist,sans-serif;color:#8F8A80;padding:4px 8px">None connected.</div>';
    return;
  }
  box.innerHTML = list.map(function(c){
    return '<div class="conn-row" style="cursor:default">' +
      '<span class="conn-badge" style="background:#E7F3EC;border-color:#B8D9C6;color:#2C6B47">Cb</span>' +
      '<div style="flex:1;min-width:0;display:flex;flex-direction:column">' +
        '<span class="conn-name">' + esc(c.name) + '</span>' +
        '<span style="font:400 10.5px Geist,sans-serif;color:#8F8A80">' + c.file_count + ' files</span>' +
      '</div>' +
      '<button class="chat-delete" data-cb-disconnect="' + esc(c.name) + '" style="display:flex" title="Disconnect">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>' +
      '</button>' +
    '</div>';
  }).join('');
}

async function loadSlots(){
  try {
    const r = await fetch('/models/slots');
    const d = await r.json();
    const slots = d.slots || {};
    state.models = Object.keys(slots).map(function(id){
      return {
        id: id,
        name: 'Quill ' + id.charAt(0).toUpperCase() + id.slice(1),
        short: id.charAt(0).toUpperCase() + id.slice(1),
        desc: slots[id],
        raw: slots[id]
      };
    });
    state.model = d.current_slot || 'balanced';
    renderModelButton();
    renderModelDropdown();
    renderHeader();
  } catch(e){}
}

/* ---------- Chat mutations ---------- */
function pushMsg(chatId, m){
  const msg = Object.assign({ id: nextMsgId() }, m);
  const c = state.chats.find(c => c.id === chatId);
  if (c) c.msgs = c.msgs.concat([msg]);
  return msg.id;
}
function patchMsg(chatId, id, p){
  const c = state.chats.find(c => c.id === chatId);
  if (!c) return;
  c.msgs = c.msgs.map(function(m){ return m.id === id ? Object.assign({}, m, p) : m; });
}

/* ---------- Sending ---------- */
async function uploadAttachment(file){
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch('/upload', { method: 'POST', body: fd });
  let d;
  try { d = await r.json(); } catch(e){ throw new Error('server returned bad response'); }
  if (!d.ok) throw new Error(d.error || 'upload failed');
  return d.path;
}

async function sendMessage(){
  const text = state.draft.trim();
  if (!text || !isIdle()) return;
  const chatId = state.activeId;
  if (!ws || ws.readyState !== WebSocket.OPEN){
    pushMsg(chatId, { role: 'assistant', text: 'Backend offline. Start the Python server and refresh.' });
    renderStream();
    return;
  }

  const atts = state.attachments.slice();
  const displayText = text;

  state.phase = 'thinking';
  state.runChat = chatId;
  el('input').value = '';
  state.draft = '';
  state.attachments = [];
  autoResize();
  renderAttachments();
  renderComposerState();

  let wireText = displayText;
  if (atts.length > 0){
    try {
      const notes = [];
      for (const f of atts){
        const p = await uploadAttachment(f);
        notes.push(f.name + ' at ' + p);
      }
      wireText = displayText + '\n\n[attached files: ' + notes.join('; ') + ']';
    } catch(e){
      pushMsg(chatId, { role: 'assistant', text: 'Upload failed: ' + e.message });
      state.phase = 'idle';
      state.runChat = null;
      renderStream();
      renderComposerState();
      return;
    }
  }

  const files = atts.map(function(f){ return f.name; });
  const chat = activeChat();
  if (chat && chat.msgs.length === 0) chat.title = displayText.slice(0, 48);
  pushMsg(chatId, { role: 'user', text: displayText, files: files });
  renderChatList();
  renderHeader();
  renderStream();

  try { ws.send(JSON.stringify({ message: wireText, session_id: chatId })); }
  catch(e){ startStream(chatId, 'Failed to send: ' + e.message, ++runId); }
}
/* ---------- Streaming ---------- */
function startStream(chatId, full, my){
  const id = pushMsg(chatId, { role: 'assistant', text: '', streaming: true });
  state.phase = 'streaming';
  renderStream();
  const step = 4;
  let i = 0;
  clearInterval(streamTimer);
  streamTimer = setInterval(function(){
    if (my !== runId){ clearInterval(streamTimer); return; }
    i = Math.min(full.length, i + step);
    const done = i >= full.length;
    patchMsg(chatId, id, { text: full.slice(0, i), streaming: !done });
    const node = document.querySelector('[data-msg-id="' + id + '"] .msg-asst-blocks');
    if (node) node.innerHTML = blocksHtml(full.slice(0, i));
    const stream = el('stream');
    if (stream) stream.scrollTop = stream.scrollHeight;
    if (done){
      clearInterval(streamTimer);
      state.phase = 'idle';
      state.runChat = null;
      renderStream();
      renderChatList();
      renderComposerState();
    }
  }, 16);
}

/* ---------- Confirm decisions ---------- */
function decide(msgId, kind){
  const chatId = state.activeId;
  const c = state.chats.find(c => c.id === chatId);
  if (!c) return;
  const m = c.msgs.find(x => x.id === msgId);
  if (!m) return;
  const label = kind === 'deny'
    ? 'Denied'
    : (DONE[m.tool] || 'Done') + (kind === 'always' ? ' · always allowed' : '');
  patchMsg(chatId, msgId, {
    role: 'step', ok: kind !== 'deny', bad: kind === 'deny',
    label: label, resolved: true
  });
  if (kind === 'always') state.always.push(m.tool);
  if (ws && ws.readyState === WebSocket.OPEN && m.callId){
    try { ws.send(JSON.stringify({
      type: 'confirm_response', call_id: m.callId, approved: kind !== 'deny'
    })); } catch(e){}
  }
  delete pendingConfirms[m.callId];
  renderStream();
}

/* ---------- Stop / Retry ---------- */
function stopRun(){
  runId++;
  clearInterval(streamTimer);
  const chatId = state.runChat;
  if (chatId != null){
    const c = state.chats.find(c => c.id === chatId);
    if (c) {
      c.msgs = c.msgs.map(function(m){
        if (m.role === 'perm' && !m.resolved)
          return Object.assign({}, m, { role: 'step', bad: true, label: 'Cancelled', resolved: true });
        if (m.streaming) return Object.assign({}, m, { streaming: false });
        return m;
      });
    }
  }
  state.phase = 'idle';
  state.runChat = null;
  renderStream();
  renderComposerState();
}

function retryLast(){
  const chatId = state.activeId;
  const msgs = currentMsgs().slice();
  let cut = msgs.length;
  while (cut > 0 && msgs[cut - 1].role !== 'user') cut--;
  if (cut === 0) return;
  const lastUser = msgs[cut - 1];
  const c = state.chats.find(c => c.id === chatId);
  c.msgs = msgs.slice(0, cut - 1).concat([{ id: nextMsgId(), role: 'user', text: lastUser.text, files: lastUser.files || [] }]);
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  state.runChat = chatId;
  state.phase = 'thinking';
  renderStream();
  try { ws.send(JSON.stringify({ message: lastUser.text, session_id: chatId })); } catch(e){}
}

/* ---------- Delete chat ---------- */
function deleteChat(id){
  const idx = state.chats.findIndex(function(c){ return c.id === id; });
  if (idx < 0) return;
  const wasActive = state.activeId === id;
  state.chats.splice(idx, 1);
  if (state.chats.length === 0){
    const newId = uid();
    state.chats.push({ id: newId, title: 'New task', msgs: [] });
    state.activeId = newId;
  } else if (wasActive){
    state.activeId = state.chats[0].id;
  }
  renderChatList();
  renderStream();
  renderHeader();
  renderComposerState();
}

/* ---------- Rendering ---------- */
function blocksHtml(text){
  const out = [];
  const parts = String(text).split(/```/);
  parts.forEach(function(part, i){
    if (i % 2 === 1){
      const nl = part.indexOf('\n');
      const body = (nl >= 0 && /^[\w+-]*$/.test(part.slice(0, nl).trim()))
        ? part.slice(nl + 1) : part;
      out.push('<pre class="blk-code">' + esc(body.replace(/\n$/, '')) + '</pre>');
      return;
    }
    let para = [];
    function flush(){
      if (para.length){ out.push('<p class="blk-p">' + esc(para.join('\n')) + '</p>'); para = []; }
    }
    part.split('\n').forEach(function(raw){
      const line = raw.replace(/\*\*(.+?)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1');
      let m;
      if (!line.trim()) return flush();
      if ((m = line.match(/^\s*#{1,6}\s+(.*)/))){
        flush();
        out.push('<div class="blk-h">' + esc(m[1]) + '</div>');
      } else if ((m = line.match(/^\s*[-*•]\s+(.*)/))){
        flush();
        out.push('<div class="blk-li"><span class="blk-li-marker">•</span><span class="blk-li-text">' + esc(m[1]) + '</span></div>');
      } else if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)/))){
        flush();
        out.push('<div class="blk-li"><span class="blk-li-marker">' + esc(m[1]) + '.</span><span class="blk-li-text">' + esc(m[2]) + '</span></div>');
      } else {
        para.push(line);
      }
    });
    flush();
  });
  return out.join('');
}

function renderStream(){
  const inner = el('stream-inner');
  if (!inner) return;
  const stream = el('stream');
  const msgs = currentMsgs();
  const idle = isIdle();
  if (msgs.length === 0){
    if (stream) stream.classList.add('empty');
    inner.innerHTML = '<h1 class="empty-title">What are we working on?</h1>';
  } else {
    if (stream) stream.classList.remove('empty');
    inner.innerHTML = msgs.map(function(m){
      if (m.role === 'user'){
        const files = (m.files && m.files.length)
          ? '<div class="msg-user-files">' + m.files.map(function(f){
              return '<span class="msg-user-file">' + esc(f) + '</span>';
            }).join('') + '</div>'
          : '';
        const cls = m.saved ? 'msg-user-bubble saved' : 'msg-user-bubble';
        return '<div class="msg-user">' + files +
          '<div class="' + cls + '">' + esc(m.text) + '</div></div>';
      }
      if (m.role === 'assistant'){
        const lastAsst = msgs.slice().reverse().find(function(x){ return x.role === 'assistant'; });
        const isLast = lastAsst && lastAsst.id === m.id && !m.streaming;
        const actions = (isLast && idle)
          ? '<div class="msg-asst-actions">' +
              '<button class="msg-action" data-copy="' + m.id + '">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg>' +
                '<span>' + (state.copiedId === m.id ? 'Copied' : 'Copy') + '</span>' +
              '</button>' +
              '<button class="msg-action" data-retry="' + m.id + '">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>' +
                '<span>Retry</span>' +
              '</button>' +
            '</div>'
          : '';
        return '<div class="msg-asst" data-msg-id="' + m.id + '">' +
          '<div class="msg-asst-blocks">' + blocksHtml(m.text) + '</div>' +
          actions +
        '</div>';
      }
      if (m.role === 'perm' && !m.resolved){
        return '<div class="perm-card" data-msg-id="' + m.id + '">' +
          '<div class="perm-head">' +
            '<div class="perm-title"><span class="perm-dot"></span>Quill wants to ' + esc(VERBS[m.tool] || 'use a tool') + '</div>' +
            '<div class="perm-target">' + esc(m.target) + '</div>' +
            '<div class="perm-reason">' + esc(m.reason || '') + '</div>' +
          '</div>' +
          '<div class="perm-actions">' +
            '<button class="perm-btn" data-deny="' + m.id + '">Deny</button>' +
            '<button class="perm-btn" data-always="' + m.id + '">Always allow</button>' +
            '<button class="perm-btn primary" data-allow="' + m.id + '">Allow once</button>' +
          '</div>' +
        '</div>';
      }
      if (m.role === 'step'){
        const ok = m.ok !== false && !m.bad;
        const dot = ok
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"></path></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
        return '<div class="step">' +
          '<span class="step-dot ' + (ok ? 'ok' : 'err') + '">' + dot + '</span>' +
          '<span class="step-label">' + esc(m.label || '') + '</span>' +
          (m.target ? '<span class="step-target">' + esc(m.target) + '</span>' : '') +
        '</div>';
      }
      return '';
    }).join('');
  }
  if (state.phase === 'thinking' && state.runChat === state.activeId){
    inner.innerHTML += '<div class="thinking"><span></span><span></span><span></span></div>';
  }
  if (stream) stream.scrollTop = stream.scrollHeight;
}

function renderChatList(){
  const list = el('chat-list');
  if (!list) return;
  const q = state.query.trim().toLowerCase();
  const filtered = state.chats.filter(function(c){
    return !q || c.title.toLowerCase().indexOf(q) >= 0;
  });
  if (filtered.length === 0){
    list.innerHTML = '<div style="font:400 12.5px Geist,sans-serif;color:#8F8A80;padding:6px 8px">No tasks match.</div>';
    return;
  }
  list.innerHTML = filtered.map(function(c){
    const active = c.id === state.activeId ? ' active' : '';
    const running = (!isIdle() && state.runChat === c.id)
      ? '<span class="chat-row-running"></span>' : '';
    return '<div class="chat-row' + active + '" data-chat="' + c.id + '">' +
      '<span class="chat-row-title">' + esc(c.title) + '</span>' + running +
      '<button class="chat-delete" data-chat-delete="' + c.id + '" title="Delete chat">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>' +
      '</button>' +
    '</div>';
  }).join('');
}

function renderConnectors(){
  const list = el('conn-list');
  const count = el('conn-count');
  const inline = el('conn-inline');
  const on = state.connectors.filter(function(c){ return c.on; }).length;
  if (count) count.textContent = String(state.connectors.length);
  if (inline) inline.textContent = on + ' connected';
  if (!list) return;
  list.innerHTML = state.connectors.map(function(c){
    return '<div class="conn-row">' +
      '<span class="conn-badge">' + esc(c.mono) + '</span>' +
      '<span class="conn-name">' + esc(c.name) + '</span>' +
      '<button class="conn-toggle ' + (c.on ? 'on' : 'off') + '" data-conn="' + c.id + '" title="' + (c.on ? 'Disconnect' : 'Connect') + '">' +
        '<span class="knob"></span>' +
      '</button>' +
    '</div>';
  }).join('');
}

function renderModelButton(){
  const name = el('model-name');
  const short = el('main-model');
  const cur = state.models.find(function(m){ return m.id === state.model; }) || { short: 'Quill', name: 'Quill' };
  if (name) name.textContent = cur.short || cur.name;
  if (short) short.textContent = cur.name;
}

function renderModelDropdown(){
  const dd = el('model-dropdown');
  if (!dd) return;
  dd.innerHTML = state.models.map(function(m){
    const sel = m.id === state.model ? ' selected' : '';
    const check = m.id === state.model
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="#23211D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"></path></svg>'
      : '';
    return '<button class="model-item' + sel + '" data-model="' + m.id + '">' +
      '<div class="model-item-body">' +
        '<span class="model-item-name">' + esc(m.name) + '</span>' +
        '<span class="model-item-desc">' + esc(m.desc) + '</span>' +
      '</div>' + check +
    '</button>';
  }).join('') || '<div style="padding:12px;font:400 12.5px Geist,sans-serif;color:#8F8A80">No models available.</div>';
}

function renderHeader(){
  const c = activeChat();
  el('main-title').textContent = c ? c.title : 'New task';
}

function renderComposerState(){
  const busy = !isIdle();
  el('btn-send').style.display = busy ? 'none' : 'flex';
  el('btn-stop').style.display = busy ? 'flex' : 'none';
  el('btn-send').disabled = !state.draft.trim();
  const ta = el('input');
  if (state.phase === 'awaiting') ta.placeholder = 'Waiting for your permission…';
  else if (currentMsgs().length) ta.placeholder = 'Reply to Quill…';
  else ta.placeholder = 'Ask Quill to do something…';
}

function renderAttachments(){
  const box = el('attachments');
  if (!box) return;
  if (state.attachments.length === 0){
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  box.style.display = 'flex';
  box.innerHTML = state.attachments.map(function(f, i){
    return '<span class="attachment">' + esc(f.name) +
      '<button data-att-remove="' + i + '" title="Remove">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>' +
      '</button>' +
    '</span>';
  }).join('');
}

/* ---------- Profile ---------- */
function loadProfile(){
  const name = localStorage.getItem(LS_NAME) || 'You';
  const nameEl = el('sb-user-name');
  const avatarEl = el('sb-avatar');
  if (nameEl) nameEl.textContent = name;
  if (avatarEl) avatarEl.textContent = name.charAt(0).toUpperCase() || 'Y';
}

function openProfile(){
  el('profile-overlay').classList.remove('hidden');
  el('profile-name').value = localStorage.getItem(LS_NAME) || 'You';
  refreshProfile();
}

function closeProfile(){
  el('profile-overlay').classList.add('hidden');
}

async function refreshProfile(){
  // Vault
  try {
    const r = await fetch('/vault/status');
    const d = await r.json();
    const badge = el('vault-badge');
    if (!d.available){
      badge.textContent = 'unavailable';
      badge.className = 'profile-badge err';
    } else if (d.locked){
      badge.textContent = 'locked';
      badge.className = 'profile-badge warn';
    } else if (d.passphrase_set){
      badge.textContent = 'unlocked';
      badge.className = 'profile-badge ok';
    } else {
      badge.textContent = 'no passphrase';
      badge.className = 'profile-badge ok';
    }
    el('vault-count').textContent = (d.keys || []).length;

    const actions = el('vault-actions');
    actions.innerHTML = '';
    if (d.locked){
      const btn = document.createElement('button');
      btn.className = 'profile-btn primary';
      btn.textContent = 'Unlock vault';
      btn.onclick = promptUnlock;
      actions.appendChild(btn);
    } else if (d.passphrase_set){
      const btn = document.createElement('button');
      btn.className = 'profile-btn';
      btn.textContent = 'Lock vault';
      btn.onclick = async function(){
        await fetch('/vault/lock', { method: 'POST' });
        await refreshProfile();
      };
      actions.appendChild(btn);
    }

    const keysBox = el('vault-keys-list');
    const keys = d.keys || [];
    if (keys.length === 0){
      keysBox.innerHTML = '<div class="profile-empty">No keys stored.</div>';
    } else {
      keysBox.innerHTML = keys.map(function(k){
        return '<div class="profile-key-row"><span>' + esc(k) + '</span></div>';
      }).join('');
    }
  } catch(e){
    el('vault-badge').textContent = 'offline';
    el('vault-badge').className = 'profile-badge err';
    el('vault-keys-list').innerHTML = '<div class="profile-empty">Could not reach backend.</div>';
  }

  // OAuth / connections
  try {
    const r = await fetch('/oauth/status');
    const d = await r.json();
    const box = el('profile-connections');
    box.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'profile-row';
    const badge = d.connected
      ? '<span class="profile-badge ok">connected</span>'
      : (d.configured ? '<span class="profile-badge warn">not connected</span>'
                      : '<span class="profile-badge err">not configured</span>');
    row.innerHTML = '<span class="profile-row-label">Gmail</span>' + badge;
    box.appendChild(row);
    if (!d.connected && d.configured){
      const btn = document.createElement('button');
      btn.className = 'profile-btn primary';
      btn.textContent = 'Connect Gmail';
      btn.onclick = function(){ window.open('/oauth/google/start', '_blank'); };
      box.appendChild(btn);
    }
    if (d.connected){
      const btn = document.createElement('button');
      btn.className = 'profile-btn danger';
      btn.textContent = 'Disconnect Gmail';
      btn.onclick = async function(){
        if (!confirm('Disconnect Gmail? You can reconnect any time.')) return;
        await fetch('/oauth/google/disconnect', { method: 'POST' });
        await refreshProfile();
      };
      box.appendChild(btn);
    }
  } catch(e){
    el('profile-connections').innerHTML = '<div class="profile-empty">Could not reach backend.</div>';
  }
}

async function promptUnlock(){
  const pass = prompt('Vault passphrase:');
  if (!pass) return;
  try {
    const r = await fetch('/vault/unlock', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ passphrase: pass })
    });
    const d = await r.json();
    if (d.ok){
      await refreshProfile();
    } else {
      alert('Wrong passphrase');
    }
  } catch(e){
    alert('Failed: ' + e.message);
  }
}

/* ---------- Composer behavior ---------- */
function autoResize(){
  const ta = el('input');
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 220) + 'px';
}

function pickFiles(){ el('file-input').click(); }
function onFiles(e){
  const fs = Array.from(e.target.files || []);
  e.target.value = '';
  state.attachments = state.attachments.concat(fs);
  renderAttachments();
}

function newChat(){
  const empty = state.chats.find(function(c){ return c.msgs.length === 0 && c.title === 'New task'; });
  if (empty){
    state.activeId = empty.id;
  } else {
    const id = uid();
    state.chats.unshift({ id: id, title: 'New task', msgs: [] });
    state.activeId = id;
  }
  state.draft = '';
  state.attachments = [];
  el('input').value = '';
  autoResize();
  renderChatList();
  renderStream();
  renderAttachments();
  renderHeader();
  renderComposerState();
  el('input').focus();
}

/* ---------- Event delegation ---------- */
document.addEventListener('click', function(e){
  const t = e.target;
  const closest = function(sel){ return t.closest ? t.closest(sel) : null; };
  const cbDisconnect = closest('[data-cb-disconnect]');
  if (cbDisconnect){
    const name = cbDisconnect.getAttribute('data-cb-disconnect');
    if (!confirm('Disconnect codebase "' + name + '"? The index will be removed, files stay on disk.')) return;
    fetch('/codebase/disconnect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name })
    }).then(function(){ loadCodebases(); });
    return;
  }

  const delChat = closest('[data-chat-delete]');
  if (delChat){
    deleteChat(delChat.getAttribute('data-chat-delete'));
    return;
  }

  const copy = closest('[data-copy]');
  if (copy){
    const id = Number(copy.getAttribute('data-copy'));
    const m = currentMsgs().find(function(x){ return x.id === id; });
    if (m){
      if (navigator.clipboard) navigator.clipboard.writeText(m.text);
      state.copiedId = id;
      renderStream();
      setTimeout(function(){ state.copiedId = null; renderStream(); }, 1400);
    }
    return;
  }
  const retry = closest('[data-retry]');
  if (retry){ retryLast(); return; }

  const allow = closest('[data-allow]');
  if (allow){ decide(Number(allow.getAttribute('data-allow')), 'once'); return; }
  const always = closest('[data-always]');
  if (always){ decide(Number(always.getAttribute('data-always')), 'always'); return; }
  const deny = closest('[data-deny]');
  if (deny){ decide(Number(deny.getAttribute('data-deny')), 'deny'); return; }

  const chat = closest('[data-chat]');
  if (chat){
    state.activeId = chat.getAttribute('data-chat');
    renderChatList();
    renderStream();
    renderHeader();
    renderComposerState();
    return;
  }
  const conn = closest('[data-conn]');
  if (conn){
    const id = conn.getAttribute('data-conn');
    const c = state.connectors.find(function(x){ return x.id === id; });
    if (c){ c.on = !c.on; renderConnectors(); }
    return;
  }
  const model = closest('[data-model]');
  if (model){
    const id = model.getAttribute('data-model');
    state.model = id;
    el('model-dropdown').classList.add('hidden');
    renderModelButton();
    renderModelDropdown();
    fetch('/models/slots/select', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ slot: id })
    }).catch(function(){});
    return;
  }
  const att = closest('[data-att-remove]');
  if (att){
    const i = Number(att.getAttribute('data-att-remove'));
    state.attachments.splice(i, 1);
    renderAttachments();
    return;
  }

  if (!closest('#model-dropdown') && !closest('#btn-model')){
    el('model-dropdown').classList.add('hidden');
  }
});

/* ---------- Wire up static controls ---------- */
el('btn-new').addEventListener('click', newChat);
el('btn-attach').addEventListener('click', pickFiles);
el('file-input').addEventListener('change', onFiles);
el('btn-send').addEventListener('click', sendMessage);
el('btn-stop').addEventListener('click', stopRun);
el('btn-mode').addEventListener('click', function(){
  const next = getMode() === 'ask' ? 'auto' : 'ask';
  state.mode = next;
  el('mode-label').textContent = next === 'ask' ? 'Ask first' : 'Auto-approve';
  el('mode-dot').style.background = next === 'ask' ? '#4F7A5A' : '#C98A2B';
});
el('btn-model').addEventListener('click', function(e){
  e.stopPropagation();
  el('model-dropdown').classList.toggle('hidden');
});

el('search').addEventListener('input', function(e){
  state.query = e.target.value;
  renderChatList();
});

el('btn-collapse').addEventListener('click', function(){
  el('sidebar').classList.add('collapsed');
  el('btn-open').style.display = 'flex';
});
el('btn-open').addEventListener('click', function(){
  el('sidebar').classList.remove('collapsed');
  el('btn-open').style.display = 'none';
});
el('btn-add-codebase').addEventListener('click', function(){
  const path = prompt('Codebase path or GitHub URL:');
  if (!path) return;
  const ta = el('input');
  ta.value = 'connect to the codebase at ' + path;
  state.draft = ta.value;
  autoResize();
  el('btn-send').disabled = false;
  ta.focus();
});

el('btn-profile').addEventListener('click', openProfile);
el('btn-profile-close').addEventListener('click', closeProfile);
el('profile-overlay').addEventListener('click', closeProfile);
el('profile-name').addEventListener('input', function(e){
  const name = e.target.value.trim() || 'You';
  localStorage.setItem(LS_NAME, name);
  el('sb-user-name').textContent = name;
  el('sb-avatar').textContent = name.charAt(0).toUpperCase() || 'Y';
});

const ta = el('input');
ta.addEventListener('input', function(){
  state.draft = ta.value;
  autoResize();
  el('btn-send').disabled = !state.draft.trim();
});
ta.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    sendMessage();
  }
});

document.addEventListener('keydown', function(e){
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    newChat();
  }
  if (e.key === 'Escape'){
    el('model-dropdown').classList.add('hidden');
    if (!el('profile-overlay').classList.contains('hidden')) closeProfile();
  }
});

/* ---------- Boot ---------- */
loadProfile();
renderChatList();
renderStream();
renderHeader();
renderComposerState();
renderAttachments();
connectWS();
loadConnectors();
loadCodebases();  
loadSlots();
el('input').focus();

})();
</script>
