[package]
name = "quill_core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quill_core"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
